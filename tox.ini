[tox]
requires =
    tox>=4
    tox-uv>=1
envlist = py38, py39, py310, py311, py312, py313, py314, lint
skip_missing_interpreters = true

[testenv]
deps = flake8 >= 3.0.0
commands = python -m unittest discover -p "test_*.py" {posargs}

[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff format --check .
    ruff check .
